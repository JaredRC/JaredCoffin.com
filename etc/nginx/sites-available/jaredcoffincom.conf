server {
    listen 443 ssl;
    server_name jaredcoffin.com www.jaredcoffin.com jeffwcoffin.com www.jeffwcoffin.com;

    ssl_certificate /etc/letsencrypt/live/jaredcoffin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaredcoffin.com/privkey.pem;

    root /var/www/html;
    index index.php index.html index.htm;
}