server {
    if ($host = www.hatetracker.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = hatetracker.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.jaredcoffin.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = jaredcoffin.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name jaredcoffin.com www.jaredcoffin.com hatetracker.cc www.hatetracker.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jaredcoffin.com www.jaredcoffin.com jeffwcoffin.com www.jeffwcoffin.com hatetracker.cc www.hatetracker.cc hatetrack.org www.hatetrack.org;
    ssl_certificate /etc/letsencrypt/live/hatetracker.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hatetracker.cc/privkey.pem; # managed by Certbot

    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }

    location /odata/sample {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /odata/alyx/ {
        proxy_pass http://127.0.0.1:5100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /odata/state {
        proxy_pass http://127.0.0.1:5200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /odata/police/ {
        proxy_pass http://127.0.0.1:5300/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }








}